[project]
name = "opencode-mcp"
version = "0.0.0"
description = "MCP server that exposes the local OpenCode server as tools"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.2",
    "python-dotenv>=1.2.3",
]

[project.scripts]
opencode-mcp = "opencode_mcp.server:main"

[dependency-groups]
dev = [
    "anyio>=4",
    "pytest>=9",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
